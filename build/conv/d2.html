<!doctype html><html><head><meta charset="utf-8">
<script>window.EXCALIDRAW_ASSET_PATH="/dist/prod/";</script>
<script src="/bundle.js"></script><script src="/scenes.js"></script>
</head><body><pre id="out"></pre><script>
const log = (m) => { document.getElementById("out").textContent += "\n" + m; fetch("/log", {method:"POST", body:String(m)}); };
(async () => {
  const EX = window.__EX;
  log("KEYS " + Object.keys(EX).join(","));
  log("FN " + String(EX.exportToSvg).replace(/\s+/g, " ").slice(0, 300));
  const sc = window.__SCENES.find((s) => s.name === "哲学基底三角");
  const r = EX.restoreElements(sc.elements, null);
  const els = EX.getNonDeletedElements(r);
  const appState = { exportBackground: true, exportPadding: 24, viewBackgroundColor: "#ffffff", exportWithDarkMode: false, exportEmbedScene: false };
  const svg = await EX.exportToSvg(els, appState, null, {});
  log("viewBox " + svg.getAttribute("viewBox") + " children " + svg.children.length);
  // 换个姿势：json 往返
  const clone = JSON.parse(JSON.stringify(els));
  const svg2 = await EX.exportToSvg(clone, appState, null, {});
  log("clone viewBox " + svg2.getAttribute("viewBox") + " children " + svg2.children.length + " cloneLen " + clone.length + " isArray " + Array.isArray(clone));
  log("DONE");
})().catch((e) => log("ERR " + (e && e.stack || e)));
</script></body></html>
